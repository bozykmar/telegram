name: 04_BTC_Charts

on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 UTC = 09:00 zimą / 10:00 latem (slot 09)
    - cron: "0 18 * * *"   # 18:00 UTC = 19:00 zimą / 20:00 latem (slot 19)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-charts
  cancel-in-progress: false

jobs:
  btc-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/04_BTC_Charts_bot.yml

      - run: pip install requests pandas numpy matplotlib six mplfinance

      - name: Wykresy BTC D1, W1 i M1 (RSI, FVG, OB, RB)
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WYKRESY: ${{ vars.TELEGRAM_THREAD_WYKRESY }}
        run: python 04_BTC_Charts.py
