name: 04_BTC_Charts

on:
  schedule:
    - cron: "15 7 * * *"    # 07:15 UTC = 09:15 latem (CEST)
    - cron: "15 8 * * *"    # 08:15 UTC = 09:15 zimą (CET)
    - cron: "15 18 * * *"   # 18:15 UTC = 20:15 latem (CEST)
    - cron: "15 19 * * *"   # 19:15 UTC = 20:15 zimą (CET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    with:
      schedule: ${{ github.event.schedule }}

  btc-charts:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: btc-charts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/04_BTC_Charts_bot.yml

      - run: pip install requests pandas numpy matplotlib six mplfinance

      - name: Wykresy BTC D1, W1 i M1 (04_BTC_Charts.py)
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WYKRESY: ${{ vars.TELEGRAM_THREAD_WYKRESY }}
        run: python 04_BTC_Charts.py
