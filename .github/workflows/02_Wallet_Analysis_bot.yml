# Analiza automatyczna na podstawie pozycji portfeli (konsensus ważony
# wielkością konta, udziałem marginu i trendem). To nie jest rekomendacja
# inwestycyjna. Portfele mogą być zabezpieczone innymi pozycjami, a handel
# dźwignią niesie ryzyko utraty całego depozytu.

name: 02_Wallet_Analysis

on:
  schedule:
    - cron: "15 7 * * *"   # codziennie 07:15 UTC (08:15 zimą / 09:15 latem w Polsce)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Analiza portfeli
        run: python 02_Wallet_Analysis.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
