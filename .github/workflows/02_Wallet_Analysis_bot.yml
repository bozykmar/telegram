# Analiza automatyczna na podstawie pozycji portfeli (konsensus ważony
# wielkością konta, udziałem marginu i trendem). To nie jest rekomendacja
# inwestycyjna. Portfele mogą być zabezpieczone innymi pozycjami, a handel
# dźwignią niesie ryzyko utraty całego depozytu.

name: 02_Wallet_Analysis

on:
  schedule:
    - cron: "10 8,18 * * *"   # 08:0 UTC (09:00 zimą / 10:00 latem w Polsce)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Analiza portfeli
        run: python 02_Wallet_Analysis.py
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ANALYSIS: ${{ vars.TELEGRAM_THREAD_ANALYSIS }}

      - name: Zapisz historię
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f 02_Analysis_History.json ] && git add 02_Analysis_History.json
          if git diff --staged --quiet; then
            echo "Brak zmian w historii"
            exit 0
          fi
          git commit -m "Aktualizacja historii analizy"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Próba $i nieudana, ponawiam..."
            sleep 5
          done
          exit 1
