name: 02_Wallet_Analysis

on:
  schedule:
    - cron: "15 7 * * *"    # 07:15 UTC = 09:15 latem (CEST)
    - cron: "15 8 * * *"    # 08:15 UTC = 09:15 zimą (CET)
    - cron: "15 18 * * *"   # 18:15 UTC = 20:15 latem (CEST)
    - cron: "15 19 * * *"   # 19:15 UTC = 20:15 zimą (CET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    with:
      schedule: ${{ github.event.schedule }}

  analysis:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wallet-analysis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/02_Wallet_Analysis_bot.yml

      - run: pip install requests

      - name: Analiza portfeli (02_Wallet_Analysis.py)
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ANALYSIS: ${{ vars.TELEGRAM_THREAD_ANALYSIS }}
        run: python 02_Wallet_Analysis.py

      - name: Zapisz historię
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f 02_Analysis_History.json ] && git add 02_Analysis_History.json
          if git diff --staged --quiet; then
            echo "Brak zmian w historii"
            exit 0
          fi
          git commit -m "Aktualizacja historii analizy"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            echo "Próba $i nieudana, ponawiam..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
