name: _Gate

# Wspólna bramka czasu dla workflow 00-04.
# GitHub Actions liczy cron wyłącznie w UTC, a godziny mają być 09:15 i 20:15 czasu polskiego.
# Dlatego każdy workflow ma 4 crony (letnie i zimowe), a ta bramka przepuszcza tylko ten,
# który odpowiada aktualnemu przesunięciu Europe/Warsaw. Ręczne uruchomienie przechodzi zawsze.

on:
  workflow_call:
    inputs:
      schedule:
        type: string
        default: ""
    outputs:
      run:
        description: "true, gdy workflow ma się wykonać"
        value: ${{ jobs.gate.outputs.run }}
      slot:
        description: "09 albo 20 (pusty przy ręcznym uruchomieniu)"
        value: ${{ jobs.gate.outputs.slot }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.slot.outputs.run }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - id: slot
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ inputs.schedule }}
        run: |
          run=true
          slot=""
          offset=$(TZ=Europe/Warsaw date +%z)
          if [ "$EVENT" = "schedule" ]; then
            case "$offset|$SCHEDULE" in
              "+0200|15 7 * * *"|"+0100|15 8 * * *")   slot=09 ;;
              "+0200|15 18 * * *"|"+0100|15 19 * * *") slot=20 ;;
              *) run=false ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Zdarzenie: $EVENT | cron: '$SCHEDULE' | offset Warszawy: $offset | run=$run slot=$slot"
