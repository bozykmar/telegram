name: 01_Whale_Wallet

on:
  schedule:
    - cron: "0 8 * * *"   # 08:0 UTC (09:00 zimą / 10:00 latem w Polsce)
    - cron: "0 18 * * *"   # 08:0 UTC (09:00 zimą / 10:00 latem w Polsce)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Raport portfeli
        run: python 01_Wallet_Whale.py
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WHALE: ${{ vars.TELEGRAM_THREAD_WHALE }}

      - name: Zapisz historię
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f 01_Wallet_History.json ] && git add 01_Wallet_History.json
          if git diff --staged --quiet; then
            echo "Brak zmian w historii"
            exit 0
          fi
          git commit -m "Aktualizacja historii portfeli"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Próba $i nieudana, ponawiam..."
            sleep 5
          done
          exit 1
