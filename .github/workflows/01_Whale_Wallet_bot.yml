# Analiza automatyczna na podstawie pozycji portfeli (konsensus ważony
# wielkością konta, udziałem marginu i trendem). To nie jest rekomendacja
# inwestycyjna. Portfele mogą być zabezpieczone innymi pozycjami, a handel
# dźwignią niesie ryzyko utraty całego depozytu.

name: 01_Whale_Wallet

on:
  schedule:
    - cron: "0 7 * * *"   # codziennie 07:00 UTC (08:00 zimą / 09:00 latem w Polsce)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Analiza portfeli
        continue-on-error: true   # błąd analizy nie blokuje raportu i zapisu historii
        run: python 02_Wallet_Analysis.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Raport portfeli
        run: python 01_Wallet_Whale.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Zapisz historię
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 01_Wallet_History.json
          if git diff --staged --quiet; then
            echo "Brak zmian w historii"
            exit 0
          fi
          git commit -m "Aktualizacja historii portfeli"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Próba $i nieudana, ponawiam..."
            sleep 5
          done
          exit 1
