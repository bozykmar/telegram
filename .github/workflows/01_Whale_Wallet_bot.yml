name: 01_Whale_Wallet

on:
  schedule:
    - cron: "5 8 * * *"    # 08:05 UTC = 09:05 zimą / 10:05 latem (slot 09)
    - cron: "5 18 * * *"   # 18:05 UTC = 19:05 zimą / 20:05 latem (slot 19)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/01_Whale_Wallet_bot.yml

      - run: pip install requests

      - name: Raport portfeli
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WHALE: ${{ vars.TELEGRAM_THREAD_WHALE }}
          SLOT: ${{ github.event.schedule == '5 8 * * *' && '09' || github.event.schedule == '5 18 * * *' && '19' || '' }}
        run: python 01_Wallet_Whale.py ${SLOT:+--slot "$SLOT"}

      - name: Zapisz historię
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f 01_Wallet_History.json ] && git add 01_Wallet_History.json
          if git diff --staged --quiet; then
            echo "Brak zmian w historii"
            exit 0
          fi
          git commit -m "Aktualizacja historii portfeli"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Próba $i nieudana, ponawiam..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
