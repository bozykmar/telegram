name: WhaleWallet Raport

on:
  schedule:
    # 07:00 UTC odpowiada 08:00 czasu zimowego / 09:00 czasu letniego w Polsce
    - cron: '0 7 * * *'
  workflow_dispatch: # Umożliwia ręczne uruchomienie testowe

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install requests

      - name: Uruchomienie skryptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python WhaleWallet.py
