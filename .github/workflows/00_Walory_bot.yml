name: Walory Raport

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 09:00 zimą / 10:00 latem w Polsce

permissions:
  contents: read

concurrency:
  group: walory-report
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Obsłuż Menu Telegrama (menu.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WALORY: ${{ vars.TELEGRAM_THREAD_WALORY }}
        run: python menu.py

      - name: Uruchom Główny Raport (00_Walory.py)
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WALORY: ${{ vars.TELEGRAM_THREAD_WALORY }}
        run: python 00_Walory.py
