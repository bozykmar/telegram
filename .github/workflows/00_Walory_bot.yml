name: 00_Walory

on:
  workflow_dispatch:
  schedule:
    - cron: "2 8 * * *"   # 08:02 UTC = 09:02 zimą / 10:02 latem w Polsce

permissions:
  contents: read

concurrency:
  group: walory-report
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/00_Walory_bot.yml

      - name: Zainstaluj biblioteki
        run: pip install requests yfinance pandas

      - name: Uruchom raport (00_Walory.py)
        env:
          TELEGRAM_TOKEN: ${{ vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_WALORY: ${{ vars.TELEGRAM_THREAD_WALORY }}
        run: python 00_Walory.py
