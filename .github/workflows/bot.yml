name: Telegram Bot Runner

on:
  workflow_dispatch: # Pozwala też na ręczne uruchomienie przyciskiem
  schedule:
    # Uruchamia się 2 razy dziennie: o 07:00 i 15:00 UTC
    - cron: '0 7,15 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom skrypt
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python skrypt.py
